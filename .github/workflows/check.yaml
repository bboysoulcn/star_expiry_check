name: star_expiry_check
on:
  push:
    branches: [ main, master ]
  schedule:
    # 每周一早上 8:00 UTC 运行 (北京时间 16:00)
    - cron: '0 8 * * 1'
  workflow_dispatch:  # 允许手动触发

jobs:
  scan:
    name: Check Starred Repos Expiry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx loguru feedparser html2text rich
      
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: cache_starred_repos.json
          key: starred-repos-${{ hashFiles('cache_starred_repos.json') }}
          restore-keys: |
            starred-repos-
      
      - name: Run star expiry check
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: python main.py
      
      - name: Save cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: cache_starred_repos.json
          key: starred-repos-${{ github.run_id }}